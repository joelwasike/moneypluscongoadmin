<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <title>Dashboard</title>
</head>
<body>
  <div id="app"></div>
  <script src="/src/scripts/admin_shared.js"></script>
  <script>
    (() => {
      if (!AdminShared.requireAdmin()) return;
      const transactions = AdminShared.transactions();
      const successful = transactions.filter((tx) => String(tx.status).toLowerCase() === 'success');
      const failed = transactions.filter((tx) => String(tx.status).toLowerCase() !== 'success');
      const totalAmount = transactions.reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
      const successAmount = successful.reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
      const failedAmount = failed.reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const monthData = months.map((month) => {
        const bucket = transactions.filter((tx) => new Date(tx.dateTime).toLocaleString('default', { month: 'short' }) === month);
        return {
          success: bucket.filter((tx) => String(tx.status).toLowerCase() === 'success').length,
          failed: bucket.filter((tx) => String(tx.status).toLowerCase() !== 'success').length,
        };
      });

      document.getElementById('app').innerHTML = AdminShared.shell('Dashboard', 'Admin overview', `
        <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
          ${[
            ['Total Transactions', transactions.length, `XAF ${AdminShared.formatXAF(totalAmount).replace('XAF ', '')}`],
            ['Successful', successful.length, AdminShared.formatXAF(successAmount)],
            ['Failed', failed.length, AdminShared.formatXAF(failedAmount)],
            ['Approved Users', AdminShared.users().filter((u) => AdminShared.isApprovedStatus(u.kycStatus || u.kybStatus || u.verificationStatus)).length, 'Verified accounts'],
          ].map(([label, value, meta]) => `
            <div class="rounded-3xl border border-slate-200 bg-slate-50 p-5">
              <div class="text-sm font-medium text-slate-500">${label}</div>
              <div class="mt-2 text-3xl font-black">${value}</div>
              <div class="mt-1 text-sm text-slate-500">${meta}</div>
            </div>
          `).join('')}
        </div>
        <div class="mt-6 rounded-3xl border border-slate-200 bg-white p-5">
          <div class="mb-3 text-lg font-semibold">Monthly Transaction Mix</div>
          <div style="height:320px"><canvas id="chart"></canvas></div>
        </div>
      `);

      document.getElementById('logoutBtn')?.addEventListener('click', () => {
        localStorage.removeItem('isAdmin');
        window.location.href = 'index.html';
      });

      new Chart(document.getElementById('chart'), {
        type: 'bar',
        data: {
          labels: months,
          datasets: [
            { label: 'Successful', data: monthData.map((x) => x.success), backgroundColor: '#16a34a' },
            { label: 'Failed', data: monthData.map((x) => x.failed), backgroundColor: '#dc2626' },
          ],
        },
        options: { responsive: true, maintainAspectRatio: false },
      });
    })();
  </script>
</body>
</html>
